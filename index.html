<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#282932">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@600;800&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1b2230; --muted:#5d6676; --line:#dde1e8; --accent:#1d5fae;
  --charcoal:#282932; --lichen:#c6e76c;
  --tint-l:92%; --tint-s:70%; --ink-l:30%; --dot-l:48%;
  --hs:62%; --solid-l:44%; --ts:65%; --x-l:90%; --chip-l:95%; --xink-l:25%;
  --off-bg:#e6e9ee; --off-fg:#4f5868; --off-hl:#cfd4dc;
  --al-bg:#d92d20; --al-fg:#ffffff; --sick-bg:#f79009; --sick-fg:#1b2230; --toil-bg:#fdd835; --toil-fg:#1b2230; --bv-bg:#475467; --bv-fg:#ffffff;
  --warn-bg:#fff4e5; --warn-line:#f5c37a; --warn-fg:#8a4b00;
  --good:#1f7a45; --hl-bg:#1b2230; --hl-fg:#ffffff; --scrim:rgba(20,22,30,.45);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161d; --surface:#1a2029; --fg:#e8ecf2; --muted:#9aa3b2; --line:#2c3440; --accent:#7fb2f0;
  --tint-l:20%; --tint-s:40%; --ink-l:82%; --dot-l:62%;
  --solid-l:40%; --ts:35%; --x-l:24%; --chip-l:19%; --xink-l:84%;
  --bv-bg:#667085;
  --off-bg:#262d38; --off-fg:#a3acbb; --off-hl:#3a4250;
  --warn-bg:#3a2a12; --warn-line:#8a5a1c; --warn-fg:#f6c27a;
  --good:#2f9a5c; --hl-bg:#e8ecf2; --hl-fg:#12161d; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px + var(--bn))}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:16px}
.wrap.wide{max-width:1800px}
.toolbar{display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){
  .wide .toolbar{flex-direction:row;align-items:center;gap:16px}
  .wide .toolbar .tabs{flex:0 0 440px}
  .wide .toolbar .navline{flex:1;max-width:560px;margin:0 auto}
}
.editbar{display:flex;align-items:center;gap:10px;background:var(--charcoal);color:#fff;border-radius:12px;padding:10px 12px}
.editbar .who{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--lichen);color:var(--charcoal);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.btn{border-radius:10px;padding:0 14px;min-height:44px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.dark{background:var(--charcoal);color:var(--lichen);border-color:var(--charcoal)}
.btn.ghost-l{background:transparent;color:var(--lichen);border-color:var(--lichen);min-height:40px}
.btn.small{min-height:36px;font-size:13px;padding:0 10px}
.btn:disabled{opacity:.5;cursor:default}
.brand{display:flex;align-items:center;gap:10px;background:var(--charcoal);color:#fff;border-radius:14px;padding:14px 16px}
.brand .bl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.brand .bt{margin:0;line-height:0;color:#c5e86c}
.brand .bt .logo{height:20px;width:auto;max-width:100%}
.brand .bs{font-size:12px;color:#b9bfcb;line-height:1.3}
.brand .chip{flex:none;background:transparent;color:var(--lichen);border:1px solid var(--lichen);border-radius:99px;padding:0 12px;min-height:34px;font-size:13px;font-weight:700;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .chip:hover{background:rgba(198,231,108,.12)}
@media (max-width:820px){.brand{border-radius:0;margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.printhead{display:none}
/* bottom tab bar on phones; top tabs on laptops */
:root{--bn:0px}
.bnav{display:none}
@media (max-width:899px){
  :root{--bn:calc(62px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:5px max(6px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bnav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:11px;padding:4px 0;min-height:52px;max-width:120px;margin:0 auto}
  .bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;padding:3px 14px;border-radius:99px;box-sizing:content-box}
  .bnav button[aria-current="page"]{color:var(--fg)}
  .bnav button[aria-current="page"] svg{background:var(--lichen);color:var(--charcoal);stroke-width:2.2}
  .toolbar .tabs:not(.hasx){display:none}
  .toolbar .tabs.hasx{background:transparent;padding:0;gap:8px}
  .toolbar .tabs.hasx button[data-main]{display:none}
  .toolbar .tabs.hasx button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:38px;padding:0 14px}
  .toolbar .tabs.hasx button[aria-selected="true"]{background:var(--charcoal);color:var(--lichen);border-color:var(--charcoal)}
  .toolbar{gap:10px!important}
  .bar{bottom:var(--bn)!important;padding-bottom:12px!important}
  .toast{bottom:calc(16px + var(--bn))!important}
}
.navline{display:flex;align-items:center;gap:8px}
.navline .navrow{flex:1;min-width:0}
.navline .navrow .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlpill{position:relative;display:flex;align-items:center;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:44px;color:var(--muted)}
.hlpill.on{background:var(--hl-bg);color:var(--hl-fg);border-color:var(--hl-bg)}
.hlpill .ic{position:absolute;left:11px;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;pointer-events:none}
.hlpill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font-weight:700;font-size:14px;min-height:42px;padding:0 30px 0 34px;max-width:150px;border-radius:99px;text-overflow:ellipsis}
.hlpill::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.hlpill select option{color:var(--fg);background:var(--surface)}
.printonly{display:none}
.navrow .lbl .sm{display:none}
.lblbtn{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;padding:0;min-height:44px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.lblbtn small{font-size:11px;font-weight:600;color:var(--accent)}
@media (max-width:640px){.navrow .lbl .lg{display:none}.navrow .lbl .sm{display:inline}.navrow .lblbtn small.sm{display:block}.navrow [data-act=thisweek].btn{display:none}.hlpill.on select{max-width:118px;padding:0 26px 0 32px}
  .hlpill:not(.on){width:46px;justify-content:center}.hlpill:not(.on) select{width:46px;padding:0;color:transparent}.hlpill:not(.on)::after{display:none}.hlpill:not(.on) .ic{left:13px;width:19px;height:19px}}
.mstate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
.mstate .mpill{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.mstate .mtxt{flex:1;min-width:180px;font-size:.92rem;color:var(--muted)}
.mstate .mbtns{display:flex;gap:6px;flex-wrap:wrap}
.mstate.draft{border-color:#e8890c;background:var(--warn-bg)}
.mstate.draft .mpill{background:#e8890c;color:#fff}
.mstate.live .mpill{background:var(--good);color:#fff}
.mstate.locked .mpill{background:#475467;color:#fff}
.btn.ghost{background:transparent}
.draftnote{border:1px solid #e8890c;background:var(--warn-bg);color:var(--warn-fg)}
.notready{align-items:flex-start;padding:16px}
.notready b{font-family:var(--display);font-size:1.15rem}

.secstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 6px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.secstrip::-webkit-scrollbar{display:none}
.secstrip button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:hsl(var(--h) var(--ts) var(--chip-l));color:var(--fg);border-radius:99px;min-height:38px;padding:0 6px 0 12px;font-weight:700;font-size:13px;white-space:nowrap}
.secstrip button b{min-width:22px;height:22px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);font-size:12px}
.secstrip button[aria-selected="true"]{background:hsl(var(--h) var(--hs) var(--solid-l));border-color:transparent;color:#fff}
.secstrip button[aria-selected="true"] b{background:rgb(255 255 255/.25);color:#fff}
.secstrip button.short b{background:#e8890c;color:#fff}

/* week grid on phones: three whole days per screen, snap a day at a time */
.wkwrap{position:relative}
.wkwrap::after{content:"";position:absolute;top:1px;right:1px;bottom:1px;width:28px;border-radius:0 10px 10px 0;background:linear-gradient(to right,transparent,var(--surface));pointer-events:none;opacity:0;transition:opacity .2s}
.wkwrap.more::after{opacity:1}
@media (max-width:640px){
  #wgrid{scroll-snap-type:x mandatory;scroll-padding-left:96px}
  #wgrid .wk{min-width:0;width:auto;table-layout:fixed}
  #wgrid .wk tbody th,#wgrid .wk thead th:first-child{white-space:normal;width:96px;min-width:96px;max-width:96px;padding-left:6px;padding-right:6px;position:sticky;left:0;z-index:2}
  #wgrid .wk thead th:first-child{background:var(--surface)}
  #wgrid .wk thead th:not(:first-child),#wgrid .wk tbody td{scroll-snap-align:start;width:calc((100vw - 32px - 2px - 96px) / 3);min-width:calc((100vw - 32px - 2px - 96px) / 3);max-width:calc((100vw - 32px - 2px - 96px) / 3)}
  #wgrid .wk td div{overflow:hidden;text-overflow:ellipsis}
}

.signscreen{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.signscreen .hero{background:var(--charcoal);color:#fff;padding:calc(36px + env(safe-area-inset-top,0px)) 24px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.signscreen .hero .logo{width:min(300px,82vw);height:auto;color:#c5e86c}
.signscreen .hero b{font-family:var(--display);font-weight:800;font-size:1.3rem}
.signscreen .body{width:100%;max-width:440px;margin:0 auto;padding:22px 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.signscreen .body h2{font-size:1.3rem}
.signscreen .form{display:flex;flex-direction:column;gap:8px}
.signscreen label{font-weight:700;font-size:14px;margin-top:4px}
.signscreen input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;min-height:48px}
.signscreen .btn.dark{min-height:50px;font-size:17px;font-weight:800;margin-top:8px}
.signscreen .help{font-size:14px;color:var(--muted);text-align:center}
.signscreen .skip{background:transparent;border:0;color:var(--accent);font-weight:700;padding:12px;min-height:44px;border-top:1px solid var(--line);margin-top:6px}
.titlerow{display:flex;align-items:flex-start;gap:12px}
.titlerow>div{flex:1;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:1.55rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:0}
.sub{color:var(--muted);font-size:.95rem}
.updated{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--line);padding:4px;border-radius:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;font-size:12px;line-height:20px;background:#d92d20;color:#fff}
.card.me-card{flex-direction:row;align-items:center;gap:12px}
.avatar{--h:28;width:50px;height:50px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;
  background:hsl(var(--h) var(--hs) var(--solid-l));color:#fff;border:0}
.me-card b{font-size:1.1rem}
.wkrow{display:flex;align-items:center;gap:10px;font-size:.95rem}
.wkrow .d{width:4.6rem;font-weight:700}
.wkrow .code{--h:28;width:46px;text-align:center;border-radius:6px;padding:2px 0;font-weight:700;font-size:.8rem}
.wkrow .code.c-X{background:hsl(var(--h) var(--ts) var(--x-l));color:hsl(var(--h) 50% var(--xink-l))}
.wkrow .code.c-N{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.wkrow .w{flex:1;color:var(--muted);min-width:0}
.reqrow{display:flex;align-items:center;gap:8px}
.reqrow>span{flex:none}
.reqrow>span:first-child{flex:1;min-width:0}
.pill-s{font-weight:700;font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill-s.waiting{background:var(--warn-bg);color:var(--warn-fg)}
.pill-s.approved{background:#e3f4ea;color:#1f7a45}
.pill-s.declined{background:#fde8e6;color:#9b1c13}
.bamboo{background:#eef3fb;color:#1b2a44;border-radius:10px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.toggle{flex:none;width:54px;height:32px;border-radius:99px;border:0;padding:3px;display:flex;background:#c8ced8;justify-content:flex-start}
.toggle[aria-pressed="true"]{background:var(--charcoal);justify-content:flex-end}
.toggle i{width:26px;height:26px;border-radius:50%;background:#fff;display:block}
.toggle[aria-pressed="true"] i{background:var(--lichen)}
.req{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.req.done{opacity:.85}
.req .top{display:flex;align-items:center;gap:8px}
.req .top b{flex:1;font-size:1.05rem}
.req .what{font-weight:700}
.req .nt{font-size:.9rem;color:var(--muted);font-style:italic}
.req .when{font-size:.8rem;color:var(--muted)}
.req .chg{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.req .chg .h,.sheet .h2{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.req .warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);border-radius:8px;padding:8px 10px;font-size:.9rem;font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn.danger{background:#b42318;border-color:#b42318;color:#fff}
.days14{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.days14 button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:5px 0;display:flex;flex-direction:column;align-items:center;min-width:0;min-height:60px}
.days14 button[aria-pressed="true"]{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.days14 .dn{font-size:.66rem;font-weight:700;text-transform:uppercase;opacity:.8}
.days14 .dd{font-family:var(--display);font-weight:800;font-size:1.05rem}
.days14 .cd{font-size:.62rem;font-weight:700}
.chipbtn{border-radius:99px;padding:0 14px;min-height:40px;font-size:15px;font-weight:700;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.chipbtn[aria-pressed="true"]{background:var(--charcoal);color:var(--lichen);border-color:var(--charcoal)}
textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;resize:vertical;min-height:64px}
.glance{background:var(--charcoal);color:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.glance .top{display:flex;align-items:baseline;gap:8px}
.glance .top b{font-family:var(--display);font-size:1.2rem;flex:1}
.glance .you{font-size:.85rem;color:var(--lichen);font-weight:700}
.glance .tiles{display:grid;gap:6px}
.glance .tile{background:rgba(255,255,255,.08);border-radius:8px;padding:8px;display:flex;flex-direction:column}
.glance .tile b{font-size:1.4rem;line-height:1.1}
.glance .tile span{font-size:.75rem;color:#b9bfcb}
.glance .tile.short{background:rgba(253,216,53,.18)}.glance .tile.short b{color:#fdd835}.glance .tile.short span{color:#f3e6a8}
.days .dot.new{background:#1d5fae}
.newtag{align-self:center;margin-right:8px;background:#1d5fae;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.needtag{align-self:center;margin-right:8px;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.dept.short{box-shadow:inset 0 0 0 2px #e8890c}
.swipehint{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.mo td.tot,.mo th.tot{background:var(--bg);font-weight:800;color:var(--fg);min-width:42px}
.mo tr.inrow td{font-weight:800;background:var(--surface);color:var(--fg)}
.mo tr.inrow td.short{background:var(--warn-bg);color:var(--warn-fg);box-shadow:inset 0 -3px #e8890c}
.mo tr.inrow th.nm{background:var(--surface);color:var(--fg);border-left-color:var(--fg)}
.cal .c[data-act]{cursor:pointer}
.wkrow[data-act]{cursor:pointer;border-radius:8px}
.wkrow[data-act]:hover{background:var(--bg)}
.nextshift{--h:28;background:hsl(var(--h) var(--ts) var(--x-l));border-left:6px solid hsl(var(--h) var(--hs) var(--solid-l));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;color:hsl(var(--h) 50% var(--xink-l))}
.nextshift .h{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.nextshift b{font-family:var(--display);font-size:1.35rem}
.nextshift span:last-child{font-size:.9rem}
.minrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:3px 0}
.minrow input{width:3.2rem;text-align:center}
.cover{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cover .dotc{width:12px;height:12px;border-radius:50%;flex:none}
.cover>div{flex:1;min-width:0;display:flex;flex-direction:column}
.loginrow{display:grid;grid-template-columns:7rem 1fr 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.loginrow input{min-width:0}
.jobtitle{margin:0;font-size:.95rem;font-weight:700;color:var(--muted)}

async function ensureRange(a,b){
  const months=[];let d=new Date(a.getFullYear(),a.getMonth(),1);
  while(d<=b){months.push([d.getFullYear(),d.getMonth()]);d=new Date(d.getFullYear(),d.getMonth()+1,1)}
  const need=months.filter(([y,m])=>!S.loaded.has(mkey(y,m)));
  if(!need.length) return;
  const tbl="rota_status";
  await Promise.all(need.map(async([y,m])=>{
    const f=iso(new Date(y,m,1)),l=iso(new Date(y,m+1,0)),pre=mkey(y,m)+"-";
    const [st,pl]=await Promise.all([
      api(tbl+"?select=day,name,code&day=gte."+f+"&day=lte."+l+"&limit=5000"),
      api("rota_place?select=day,section,names&day=gte."+f+"&day=lte."+l+"&limit=5000")]);
    for(const k of [...S.status.keys()]) if(k.startsWith(pre)) S.status.delete(k);
    for(const k of [...S.place.keys()]) if(k.startsWith(pre)) S.place.delete(k);
    for(const r of st||[]) S.status.set(sk(r.day,r.name),r.code);
    for(const r of pl||[]) S.place.set(pk(r.day,r.section),r.names||[]);
    S.loaded.add(mkey(y,m));
    seenInit(y,m);
  }));
  cacheSave();
}
function visibleRange(){
  if(S.view==="month"||S.view==="person"){return[new Date(S.my.y,S.my.m,1),new Date(S.my.y,S.my.m+1,0)]}
  if(S.view==="me") return [new Date(today0().getFullYear(),today0().getMonth(),1),addDays(today0(),45)];
  if(S.view==="requests"){const ds=S.reqs.flatMap(r=>r.days||[]).sort();return [ds.length?fromIso(ds[0]):today0(),ds.length?fromIso(ds[ds.length-1]):today0()]}
  const ws=monday(S.cur);return[ws,addDays(ws,6)];
}
async function go(){
  render();

  try{const[a,b]=visibleRange();await ensureRange(a,b);S.offline=false}catch(e){S.offline=true}

}

/* ---------- effective values (published + your unpublished edits) ---------- */
const stOf=(day,n)=>{const k=sk(day,n);return S.pend.status.has(k)?S.pend.status.get(k):(S.status.get(k)??null)};
const plOf=(day,s)=>{const k=pk(day,s);return S.pend.place.has(k)?S.pend.place.get(k):(S.place.get(k)||[])};
const mstate=k=>(S.months&&S.months[k])||"live";
const isDraftDay=d=>mstate(d.slice(0,7))==="draft";
const isLockedDay=d=>mstate(d.slice(0,7))==="locked";
function lockNote(d){const x=fromIso(d);S.note=ML[x.getMonth()]+" "+x.getFullYear()+" is locked. Unlock it on the Month tab to change it.";S.noteErr=true}
const pendDays=()=>[...new Set([...S.pend.status.keys(),...S.pend.place.keys()].map(k=>k.slice(0,10)))];
const allDraft=()=>{const d=pendDays();return d.length>0&&d.every(isDraftDay)};
function setSt(day,n,code){if(isLockedDay(day)){lockNote(day);return false}const k=sk(day,n),srv=S.status.get(k)??null;if(code===srv)S.pend.status.delete(k);else S.pend.status.set(k,code);savePend()}
function setPl(day,s,names){if(isLockedDay(day)){lockNote(day);return false}const k=pk(day,s),srv=S.place.get(k)||[];if(names.join("|")===srv.join("|"))S.pend.place.delete(k);else S.pend.place.set(k,names.slice());savePend()}
const pendCount=()=>S.pend.status.size+S.pend.place.size;
const placeChanged=(day,s)=>S.pend.place.has(pk(day,s));
const sortStaff=a=>a.slice().sort((x,y)=>(TEAM_ORDER[x.team]??9)-(TEAM_ORDER[y.team]??9)||x.sort-y.sort||x.name.localeCompare(y.name));
const titleOf=n=>((S.staff.find(p=>p.name===n)||{}).title||"").trim();
const activeStaff=()=>sortStaff(S.staff.filter(s=>s.active));
const placeable=()=>activeStaff().filter(p=>!NOSEC.has(p.team));
const hueOf=n=>{const s=S.staff.find(x=>x.name===n);return TEAM_HUE[s&&s.team]??210};
const placedIn=(day,n)=>SECTIONS.filter(([s])=>plOf(day,s).includes(n)).map(x=>x[0]);
function issuesFor(day){
  const out=[];
  for(const [s] of SECTIONS) for(const n of plOf(day,s)){const c=stOf(day,n);if(c&&c!=="X")out.push({kind:"off",n,s,c})}
  for(const p of placeable()) if(stOf(day,p.name)==="X"&&!placedIn(day,p.name).length) out.push({kind:"unplaced",n:p.name});
  return out;
}
function weekEmpty(ws){
  for(let i=0;i<7;i++){const d=iso(addDays(ws,i));
    if(SECTIONS.some(([s])=>plOf(d,s).length)) return false;
    if(S.staff.some(p=>stOf(d,p.name))) return false;}
  return true;
}

/* ---------- minimums, counts, "changed since you last looked" ---------- */
const minOf=s=>+(S.mins&&S.mins[s]||0);
const inOn=(d,s)=>plOf(d,s).filter(n=>{const c=stOf(d,n);return !c||c==="X"});
function shortFor(d){
  if(!SECTIONS.some(([s])=>plOf(d,s).length)) return [];
  return SECTIONS.filter(([s])=>minOf(s)>0&&inOn(d,s).length<minOf(s)).map(([s])=>({s,have:inOn(d,s).length,need:minOf(s)}));
}
const inCount=d=>activeStaff().filter(p=>stOf(d,p.name)==="X").length;
const offCount=d=>activeStaff().filter(p=>{const c=stOf(d,p.name);return c&&c!=="X"}).length;
let SEEN=lsGet("nspca-rota-seen")||{days:{}};
function dayFp(d){
  const p={};for(const [s] of SECTIONS)p[s]=(S.place.get(pk(d,s))||[]).join("|");
  return {p,s:S.staff.map(x=>x.name+":"+(S.status.get(sk(d,x.name))||"")).join(",")};
}
function seenSave(){
  const cut=iso(addDays(today0(),-45));for(const k of Object.keys(SEEN.days))if(k<cut)delete SEEN.days[k];
  lsSet("nspca-rota-seen",SEEN);
}
function seenInit(y,m){ // first time a month loads on this phone: remember it silently
  const n=new Date(y,m+1,0).getDate();let ch=false;
  for(let i=1;i<=n;i++){const d=iso(new Date(y,m,i));if(!SEEN.days[d]){SEEN.days[d]=dayFp(d);ch=true}}
  if(ch)seenSave();
}
function changedFor(d){
  const old=SEEN.days[d];if(!old)return null;
  const now=dayFp(d),secs=SECTIONS.map(x=>x[0]).filter(s=>(old.p||{})[s]!==now.p[s]);
  return {secs,any:secs.length>0||old.s!==now.s};
}

  if(S.opened[d]||!S.loaded.has(d.slice(0,7)))return;

}

function coverList(d,who,sec){
  const team=(S.staff.find(p=>p.name===who)||{}).team;

}

function header(){
  let h="";
  if(S.editing) h+=`<div class="editbar noprint"><span class="pill">Editing</span><span class="who">${esc(S.session.email)}</span><button class="btn ghost-l" data-act="done">Done</button></div>`;
  const per=(S.view==="month"||S.view==="person")?ML[S.my.m]+" "+S.my.y:S.view==="staff"?"Staff list":S.view==="me"?"My profile":S.view==="requests"?"Change requests":weekLabel(monday(S.cur));
  let upd="";
  if(S.pub&&S.pub.at){const t=new Date(S.pub.at);upd=`Updated ${isToday(t)?"today":DN[t.getDay()]+" "+t.getDate()+" "+MN[t.getMonth()]} at ${pad(t.getHours())}:${pad(t.getMinutes())}`}
  const me=S.session?(S.myName||S.session.email.split("@")[0]):"";
  h=`<header class="brand noprint"><div class="bl"><h1 class="bt">${LOGO_SM}<span class="sr">NSPCA Longford Rota</span></h1><div class="bs">Staff rota${upd?" · "+esc(upd.charAt(0).toLowerCase()+upd.slice(1)):""}</div></div>`
   +(S.isAdmin&&!S.editing?`<button class="chip" data-act="edit">Edit rota</button>`:"")
   +(S.session?`<button class="chip" data-act="view" data-v="me" aria-label="My profile">${esc(me)}</button>`:`<button class="chip" data-act="signin">Sign in</button>`)
   +`</header>`+h;
  h+=`<div class="printhead"><h1>NSPCA Longford Rota</h1><div class="sub">${esc(per)}</div>${upd?`<div class="updated">${esc(upd)}</div>`:""}</div>`;
  if(!configured()) h+=`<div class="note err"><span>This rota isn't connected to the database yet.</span></div>`;
  else if(S.offline) h+=`<div class="note err"><span>No connection. Showing the last copy saved on this phone.</span><button data-act="retry">Retry</button></div>`;
  if(S.note) h+=`<div class="note${S.noteErr?" err":""} noprint"><span>${esc(S.note)}</span><button data-act="clearnote" aria-label="Dismiss">✕</button></div>`;
  const tabs=[["day","Day"],["week","Week"],["month","Month"],["person","Person"]];
  if(S.session) tabs.push(["me","Me"]);
  if(S.isAdmin){const w=S.reqs.filter(r=>r.status==="waiting").length;tabs.push(["requests","Requests"+(w?`<span class="badge">${w}</span>`:"")])}
  if(S.editing) tabs.push(["staff","Staff"]);
  let tb="";
  const MAIN=["day","week","month","person","me"],extra=tabs.some(([v])=>!MAIN.includes(v));
  tb+=`<div class="tabs noprint${extra?" hasx":""}" role="tablist">${tabs.map(([v,l])=>`<button role="tab" data-act="view" data-v="${v}"${MAIN.includes(v)?' data-main="1"':""} aria-selected="${S.view===v}">${l}</button>`).join("")}</div>`;
  let nav="";
  if(S.view==="day"||S.view==="week"){
    const ws=monday(S.cur),thisWeek=iso(ws)===iso(monday(today0()));
    nav=`<div class="navrow noprint"><button class="step" data-act="prevw" aria-label="Previous week">‹</button>${thisWeek?`<span class="lbl">This week</span>`:`<button class="lbl lblbtn" data-act="thisweek" title="Back to this week"><span class="lg">${esc(weekLabel(ws))}</span><span class="sm">${esc(weekShort(ws))}</span><small class="sm">Back to this week</small></button>`}${thisWeek?"":`<button class="btn small" data-act="thisweek">Today</button>`}<button class="step" data-act="nextw" aria-label="Next week">›</button></div>`;
  }else if(S.view==="month"||S.view==="person"){
    nav=`<div class="navrow noprint"><button class="step" data-act="prevm" aria-label="Previous month">‹</button><span class="lbl"><span class="lg">${ML[S.my.m]} ${S.my.y}</span><span class="sm">${MN[S.my.m]} ${S.my.y}</span></span><button class="step" data-act="nextm" aria-label="Next month">›</button></div>`;
  }
  if(!["staff","me","requests"].includes(S.view)){
    const names=activeStaff().map(p=>p.name);
    nav+=`<label class="hlpill noprint${S.who?" on":""}" title="${S.view==="person"?"Person":"Highlight someone"}">${svgUser}<select id="who" aria-label="${S.view==="person"?"Person":"Highlight someone"}">${S.view==="person"?"":`<option value="">Highlight</option>`}${names.map(n=>`<option${n===S.who?" selected":""}>${esc(n)}</option>`).join("")}</select></div>`;
  }
  if(nav) tb+=`<div class="navline noprint">${nav}</div>`;
  h+=`<div class="toolbar noprint">${tb}</div>`;
  return h;
}

function glanceHtml(d){
  const x=fromIso(d),inN=inCount(d),offN=offCount(d),short=shortFor(d),anyMin=SECTIONS.some(([s])=>minOf(s)>0);
  let you="";
  if(S.myName){const c=stOf(d,S.myName),pl=placedIn(d,S.myName);you=c&&c!=="X"?"You: "+WORD[c]:pl.length?"You: "+pl.join(" + "):c==="X"?(NOSEC.has((S.staff.find(p=>p.name===S.myName)||{}).team)?"You: in":"You: in, not placed"):""}
  return `<div class="glance noprint"><div class="top"><b>${isToday(x)?"Today, ":""}${DN[x.getDay()]} ${x.getDate()}${isToday(x)?"":" "+MN[x.getMonth()]}</b>${you?`<span class="you">${esc(you)}</span>`:""}</div>
    <div class="tiles" style="grid-template-columns:repeat(${anyMin?3:2},minmax(0,1fr))"><div class="tile"><b>${inN}</b><span>in ${isToday(x)?"today":"that day"}</span></div><div class="tile"><b>${offN}</b><span>off / leave</span></div>${anyMin?`<div class="tile${short.length?" short":""}"><b>${short.length}</b><span>${short.length===1?"section short":"sections short"}</span></div>`:""}</div></div>`;
}

const KIND={swap:"Swap",toil:"TOIL",sick:"Off sick",cant:"Can't do shift"};
const KIND_BTN=[["swap","Swap a shift"],["toil","TOIL"],["sick","Off sick"],["cant","Can't do a shift"]];
const dShort=d=>{const x=fromIso(d);return DN[x.getDay()]+" "+x.getDate()+" "+MN[x.getMonth()]};
function reqWhat(r){
  const ds=(r.days||[]).slice().sort();
  if(r.kind==="swap") return "Swap · "+dShort(ds[0])+" with "+r.swap_with;
  return KIND[r.kind]+" · "+(ds.length<=3?ds.map(dShort).join(", "):dShort(ds[0])+" – "+dShort(ds[ds.length-1])+" ("+ds.length+" days)");
}
const whenText=t=>{const x=new Date(t);return (isToday(x)?"today":DN[x.getDay()]+" "+x.getDate()+" "+MN[x.getMonth()])+" "+pad(x.getHours())+":"+pad(x.getMinutes())};

/* What approving a request would do: the change list, warnings, and the edits to make */
function planRequest(r){
  const R=r.name,out={changes:[],warn:[],ops:[]};
  for(const d of (r.days||[]).slice().sort()){
    const dl=dShort(d),pl=placedIn(d,R),c=stOf(d,R);
    if(r.kind==="swap"){
      const O=r.swap_with,co=stOf(d,O);
      out.changes.push(R+": "+(pl.length?pl.join(" + "):c?WORD[c]:"–")+" → OFF ("+dl+")");
      out.changes.push(O+": "+(co?WORD[co]:"–")+" → X"+(pl.length?", on "+pl.join(" + "):"")+" ("+dl+")");
      if(co&&co!=="O") out.warn.push(O+" is "+WORD[co]+" on "+dl+", not OFF any more.");
      out.ops.push(()=>{setSt(d,R,"O");setSt(d,O,"X");for(const s of pl)setPl(d,s,plOf(d,s).map(n=>n===R?O:n).filter((n,i,a)=>a.indexOf(n)===i))});
    }else{
      const code={toil:"T",sick:"S",cant:"O"}[r.kind];
      out.changes.push(R+": "+(c?WORD[c]:"–")+" → "+WORD[code]+" ("+dl+")"+(pl.length?", comes off "+pl.join(", "):""));
      for(const s of pl){const rest=plOf(d,s).filter(n=>n!==R);
        if(!rest.length) out.warn.push(s+" would have nobody on "+dl+".");
        else if(rest.length===1) out.warn.push(s+" would be down to "+rest[0]+" only on "+dl+".");}
      out.ops.push(()=>{setSt(d,R,code);for(const s of pl)setPl(d,s,plOf(d,s).filter(n=>n!==R))});
    }
  }
  return out;
}

/* ---------- notifications ---------- */
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function pushState(){
  if(isIOS()&&!standalone()) return "ios-browser";
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)) return "unsupported";
  return "ok";
}
const b64u=s=>{const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushOn(name){
  S.busy=true;S.pushErr="";render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted") throw new Error("Notifications are blocked. Allow them for the rota in your phone's settings, then try again.");
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(CONFIG.push)}));
    await api("rpc/rota_push_subscribe",{method:"POST",body:{p_endpoint:sub.endpoint,p_name:name,p_sub:sub.toJSON()}});
    lsSet("nspca-rota-push",name);S.sheet=null;S.note="Notifications are on. You'll get one when your days change.";S.noteErr=false;
  }catch(e){S.pushErr=e.message||"Couldn't turn notifications on."}
  S.busy=false;render();
}
async function pushOff(){
  S.busy=true;S.pushErr="";render();
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){try{await api("rpc/rota_push_unsubscribe",{method:"POST",body:{p_endpoint:sub.endpoint}})}catch(e){} await sub.unsubscribe()}
    lsSet("nspca-rota-push",null);S.sheet=null;S.note="Notifications are off on this phone.";S.noteErr=false;
  }catch(e){S.pushErr="Couldn't turn notifications off."}
  S.busy=false;render();
}
function changeSummary(){
  const t=iso(today0()),hit=new Map();
  const add=(d,n)=>{if(d<t||isDraftDay(d))return;if(!hit.has(n))hit.set(n,new Set());hit.get(n).add(d)};
  for(const k of S.pend.status.keys()){const i=k.indexOf("|");add(k.slice(0,i),k.slice(i+1))}
  for(const [k,names] of S.pend.place){const i=k.indexOf("|"),d=k.slice(0,i),old=S.place.get(k)||[];
    for(const n of names) if(!old.includes(n)) add(d,n);
    for(const n of old) if(!names.includes(n)) add(d,n);}
  const people={};
  for(const [n,days] of hit){
    const lines=[...days].sort().map(d=>{const x=fromIso(d),c=stOf(d,n),pl=placedIn(d,n);
      const what=c&&c!=="X"?WORD[c]:pl.length?pl.join(" + "):c==="X"?"X (in)":"not on the rota";
      return DN[x.getDay()]+" "+x.getDate()+" "+MN[x.getMonth()]+": "+what});
    people[n]={body:lines.slice(0,4).join("\n")+(lines.length>4?"\nand "+(lines.length-4)+" more days":""),url:"./#day-"+[...days].sort()[0]};
  }
  const all=[...hit.values()].flatMap(x=>[...x]).sort();
  if(!all.length) return {people};
  const a=fromIso(all[0]),b=fromIso(all[all.length-1]);
  const f=x=>DN[x.getDay()]+" "+x.getDate()+" "+MN[x.getMonth()];
  return {people,all:{body:"Changes for "+(all[0]===all[all.length-1]?f(a):f(a)+" – "+f(b))+". Tap to see the rota.",url:"./#day-"+all[0]}};
}
async function sendNotifications(payload){
  if(!payload.all&&!(payload.people&&Object.keys(payload.people).length)&&!payload.request) return 0;
  try{const r=await fetch(CONFIG.url+"/functions/v1/rota-notify",{method:"POST",
      headers:{apikey:CONFIG.key,Authorization:"Bearer "+(await bearer()),"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok) return null; const j=await r.json(); return j.sent||0}catch(e){return null}
}

/* ---------- actions ---------- */
async function signIn(email,pass){
  S.busy=true;S.signinErr="";render();
  try{
    const r=await fetch(CONFIG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CONFIG.key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error_description||j.msg||"Email or password not recognised.");
    setSession(j); await checkAdmin(); clearData(); S.sheet=null; await loadMe();
    S.note=S.isAdmin?"Signed in. Tap Edit rota to make changes.":"Signed in.";S.noteErr=false;
    await loadBase();
  }catch(e){S.signinErr=/invalid/i.test(e.message)?"Email or password not recognised.":e.message}
  S.busy=false; go();
}
function signOut(){
  if(pendCount()){S.note="Publish or undo your changes before signing out.";S.noteErr=true;render();return}
  S.toast="";dropSession();clearData();S.view=["staff","me","requests"].includes(S.view)?"day":S.view;S.note="Signed out.";S.noteErr=false;go();
}
async function publish(opt={}){
  if(!pendCount()||(S.busy&&!opt.inner)) return false;
  S.busy=true;render();
  const people=changeSummary(),draftOnly=allDraft();
  if(opt.override) opt.override(people);
  let ok=false;
  try{
    const ups=[],dels=[];
    for(const [k,c] of S.pend.status){const i=k.indexOf("|"),day=k.slice(0,i),name=k.slice(i+1);(c?ups:dels).push({day,name,code:c})}
    const pls=[...S.pend.place].map(([k,names])=>{const i=k.indexOf("|");return{day:k.slice(0,i),section:k.slice(i+1),names}});
    if(ups.length) await api("rota_status?on_conflict=day,name",{method:"POST",body:ups,prefer:"resolution=merge-duplicates,return=minimal"});
    for(const x of dels) await api("rota_status?day=eq."+x.day+"&name=eq."+encodeURIComponent(x.name),{method:"DELETE",prefer:"return=minimal"});
    if(pls.length) await api("rota_place?on_conflict=day,section",{method:"POST",body:pls,prefer:"resolution=merge-duplicates,return=minimal"});
    let p=null;if(!draftOnly){try{p=await api("rota_published",{method:"POST",body:{by_email:S.session.email},prefer:"return=representation"})}catch(e){}}
    for(const x of ups) S.status.set(sk(x.day,x.name),x.code);
    for(const x of dels) S.status.delete(sk(x.day,x.name));
    for(const x of pls) S.place.set(pk(x.day,x.section),x.names);
    for(const d of new Set([...ups,...dels,...pls].map(x=>x.day))) SEEN.days[d]=dayFp(d); seenSave();
    S.pend={status:new Map(),place:new Map()};savePend();cacheSave();
    if(!draftOnly) S.pub=(p&&p[0])||{at:new Date().toISOString(),by_email:S.session.email};
    ok=true;S.toast=opt.toast||(draftOnly?"Draft saved. Only admins can see it.":"Published. Staff see it the next time they open the rota.");S.note="";clearTimeout(window._tt);window._tt=setTimeout(()=>{S.toast="";render()},7000);
    if(!draftOnly) sendNotifications(people).then(n=>{if(n>0&&S.toast){S.toast=(opt.toast||"Published.").replace(/\.$/,"")+". "+n+(n===1?" phone":" phones")+" notified.";render()}});
  }catch(e){S.note="Couldn't publish ("+e.message+"). Your changes are still here, so try again.";S.noteErr=true}
  S.busy=false;render();
  return ok;
}

/* ---------- requests ---------- */
async function sendRequest(){
  const sh=S.sheet;if(!sh||S.busy)return;
  S.busy=true;S.askErr="";render();
  try{
    const row={name:S.myName,kind:sh.kind,days:sh.days.slice().sort(),swap_with:sh.kind==="swap"?sh.swap:null,note:(sh.note||"").trim()||null};
    const r=await api("rota_requests",{method:"POST",body:row,prefer:"return=representation"});
    const saved=(r&&r[0])||{...row,id:Date.now(),status:"waiting",created_at:new Date().toISOString()};
    S.reqs.unshift(saved);S.sheet=null;
    S.note="Sent for approval.";S.noteErr=false;clearTimeout(window._nt);window._nt=setTimeout(()=>{if(S.note==="Sent for approval."){S.note="";render()}},5000);
    sendNotifications({request:saved.id});
  }catch(e){S.askErr="Couldn't send ("+e.message+"). Try again."}
  S.busy=false;render();
}
async function approveRequest(id){
  const r=S.reqs.find(x=>x.id==id);if(!r||S.busy)return;
  if(pendCount()){S.note="Publish or undo your rota edits first, then approve.";S.noteErr=true;render();return}
  const ds=(r.days||[]).slice().sort();
  try{await ensureRange(fromIso(ds[0]),fromIso(ds[ds.length-1]))}catch(e){}
  if(ds.some(isLockedDay)){lockNote(ds.find(isLockedDay));render();return}
  const plan=planRequest(r);plan.ops.forEach(f=>f());
  const me=meName(),what=reqWhat(r);
  const ok=await publish({toast:"Approved. "+r.name+"'s request is on the rota.",override:p=>{
    p.people=p.people||{};p.people[r.name]={title:"Request approved",body:what+" is on the rota.\nApproved by "+me,url:"./#me"};}});
  if(!ok) return;
  try{await api("rota_requests?id=eq."+r.id,{method:"PATCH",body:{status:"approved",answered_by:me,answered_at:new Date().toISOString()},prefer:"return=minimal"});
    Object.assign(r,{status:"approved",answered_by:me,answered_at:new Date().toISOString()});}
  catch(e){S.note="The rota was updated, but the request couldn't be marked approved ("+e.message+").";S.noteErr=true}
  render();
}
async function declineRequest(id,reason){
  const r=S.reqs.find(x=>x.id==id);if(!r||S.busy)return;
  S.busy=true;render();
  const me=meName();
  try{await api("rota_requests?id=eq."+r.id,{method:"PATCH",body:{status:"declined",answered_by:me,answered_at:new Date().toISOString(),reason:reason||null},prefer:"return=minimal"});
    Object.assign(r,{status:"declined",answered_by:me,answered_at:new Date().toISOString(),reason:reason||null});S.decl=null;
    S.toast="Declined. "+r.name+" has been told.";clearTimeout(window._tt);window._tt=setTimeout(()=>{S.toast="";render()},6000);
    sendNotifications({people:{[r.name]:{title:"Request declined",body:reqWhat(r)+(reason?"\n"+me+": “"+reason+"”":""),url:"./#me"}}});
  }catch(e){S.note="Couldn't decline ("+e.message+").";S.noteErr=true}
  S.busy=false;render();
}
async function copyWeek(){
  const ws=monday(S.cur),prev=addDays(ws,-7);
  try{await ensureRange(prev,addDays(ws,6))}catch(e){S.note="Couldn't load last week.";S.noteErr=true;render();return}
  let n=0;
  for(let i=0;i<7;i++){const from=iso(addDays(prev,i)),to=iso(addDays(ws,i));
    for(const p of activeStaff()){const c=stOf(from,p.name);if(c&&stOf(to,p.name)===null){setSt(to,p.name,c);n++}}
    for(const [s] of SECTIONS){const names=plOf(from,s).filter(x=>S.staff.some(p=>p.active&&p.name===x));if(names.length&&!plOf(to,s).length){setPl(to,s,names);n++}}}
  S.note=n?"Copied last week. Change what's different, then Publish.":"Last week is empty too, so there was nothing to copy.";S.noteErr=!n;render();
}
async function saveStaff(row){
  try{await api("rota_staff?on_conflict=name",{method:"POST",body:[row],prefer:"resolution=merge-duplicates,return=minimal"});
    const i=S.staff.findIndex(p=>p.name===row.name);if(i>=0)S.staff[i]=row;else S.staff.push(row);cacheSave();return true}
  catch(e){S.note="Couldn't save the staff list ("+e.message+").";S.noteErr=true;return false}
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.sheet&&!S.busy){S.sheet=null;render();return}
  if(S.sheet&&S.sheet.type==="sec"&&(e.key==="ArrowUp"||e.key==="ArrowDown")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();S.sheet={type:"sec",i:(S.sheet.i+(e.key==="ArrowUp"?-1:1)+SECTIONS.length)%SECTIONS.length};render();return}
  if(S.sheet&&S.sheet.type==="sec"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){S.cur=addDays(S.cur,e.key==="ArrowLeft"?-1:1);go()}
});

function applyHash(){
  const h=location.hash||"";let m;
  if((m=h.match(/^#day-(\d{4}-\d{2}-\d{2})$/))){S.view="day";S.cur=fromIso(m[1]);S.my={y:S.cur.getFullYear(),m:S.cur.getMonth()};S.sheet=null;return true}
  if(h==="#month"){S.view="month";return true}
  if((m=h.match(/^#month-(\d{4})-(\d{2})$/))){S.view="month";S.my={y:+m[1],m:+m[2]-1};S.sheet=null;return true}
  if((m=h.match(/^#week-(\d{4}-\d{2}-\d{2})$/))){S.view="week";S.cur=fromIso(m[1]);S.sheet=null;return true}
  if(h==="#me"&&S.session){S.view="me";S.sheet=null;return true}
  if(h==="#requests"&&S.isAdmin){S.view="requests";S.sheet=null;return true}
  return false;
}
window.addEventListener("hashchange",async()=>{if(applyHash()){if(["me","requests"].includes(S.view))await loadMe();go()}});
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message",e=>{const u=e.data&&e.data.open;if(u){const i=u.indexOf("#");const h=i>=0?u.slice(i):"";if(h&&h!==location.hash)location.hash=h;else if(applyHash()){loadMe().then(()=>go())}}});
async function init(){
  S.session=lsGet("nspca-rota-session");S.who=lsGet("nspca-rota-who")||"";loadPend();cacheLoad();
  if(location.hash==="#month")S.view="month";
  if(!S.session&&configured()&&!lsGet("nspca-rota-viewonly")) S.sheet={type:"signin",first:true};
  render();
  if(!configured()){S.loading=false;render();return}
  try{await loadBase();if(S.session){await checkAdmin();await loadMe()}S.offline=false}catch(e){S.offline=true}
  applyHash();
  if(!S.isAdmin&&pendCount()){S.pend={status:new Map(),place:new Map()};savePend()}
  if(S.isAdmin&&pendCount()){S.editing=true;S.note="You have unpublished changes from before.";S.noteErr=false}
  if(!S.offline) S.loaded=new Set();
  go();
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
init();
</script>
</body>
</html>
